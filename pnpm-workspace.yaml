packages:
  - apps/*
  - packages/*

blockExoticSubdeps: true
minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  # Reviewed critical Next.js security release (GHSA-2xp9-vwfh-vxw4 and GHSA-p293-qw3h-jr36).
  # Root versions stay exact; wildcards cover only their platform-specific native binaries.
  - next@16.3.3
  - '@next/env@16.3.3'
  - sharp@0.35.4
  - '@next/swc-*'
  - '@img/sharp-*'
  # Existing locked queue and glob releases, reviewed for the 0.4 reproducible build.
  - bullmq@6.2.1
  - picomatch@4.0.7
trustPolicy: no-downgrade
trustPolicyExclude:
  # Existing locked watcher release; keep this exception exact and review it on upgrades.
  - chokidar@4.0.3

strictDepBuilds: true
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  esbuild: true
  msgpackr-extract: true
  prisma: true

overrides:
  '@nestjs/common': 11.2.1
  '@nestjs/core': 11.2.1
  '@nestjs/platform-express': 11.2.1
  '@prisma/adapter-pg': 7.9.1
  '@prisma/client': 7.9.1
  '@types/react-dom': 19.2.4
  bullmq: 6.2.1
  deepmerge-ts: 8.0.1
  js-yaml: 4.3.1
  libphonenumber-js: 1.13.11
  prisma: 7.9.1
  rollup: 4.62.5
  sharp: 0.35.4
  terser: 5.50.0
