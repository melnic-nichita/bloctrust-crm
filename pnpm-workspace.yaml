packages:
  - apps/*
  - packages/*

onlyBuiltDependencies:
  - '@prisma/client'
  - '@prisma/engines'
  - esbuild
  - msgpackr-extract
  - prisma

allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  esbuild: true
  msgpackr-extract: true
  prisma: true

overrides:
  bullmq: 6.2.1
  js-yaml: 4.3.1
  libphonenumber-js: 1.13.11
  terser: 5.50.0
