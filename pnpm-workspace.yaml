packages:
  - apps/*
  - packages/*

blockExoticSubdeps: true
minimumReleaseAge: 10080
trustPolicy: no-downgrade
trustPolicyExclude:
  # Existing locked watcher release; keep this exception exact and review it on upgrades.
  - chokidar@4.0.3

onlyBuiltDependencies:
  - '@prisma/client'
  - '@prisma/engines'
  - esbuild
  - msgpackr-extract
  - prisma

allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  esbuild: true
  msgpackr-extract: true
  prisma: true

overrides:
  bullmq: 6.2.1
  deepmerge-ts: 8.0.1
  js-yaml: 4.3.1
  libphonenumber-js: 1.13.11
  terser: 5.50.0
