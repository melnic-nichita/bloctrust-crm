name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
        env:
          # Client generation only needs a syntactically valid URL; this job does not connect.
          DATABASE_URL: postgresql://bloctrust:bloctrust_ci@localhost:5432/bloctrust_ci?schema=public
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm docker:validate
      - run: pnpm validate:milestone

  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - run: docker compose config --quiet
      - run: docker compose build migrate api web worker

  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: bloctrust_test
          POSTGRES_USER: bloctrust
          POSTGRES_PASSWORD: bloctrust_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bloctrust -d bloctrust_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      clamav:
        image: clamav/clamav:1.4.6_base-debian13-slim
        ports:
          - 3310:3310
        options: >-
          --health-cmd "clamdscan --ping 1"
          --health-interval 15s
          --health-timeout 10s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://bloctrust:bloctrust_test@localhost:5432/bloctrust_test?schema=public
      FIELD_ENCRYPTION_KEY: ci_only_field_encryption_key_with_at_least_32_bytes
      FIELD_ENCRYPTION_KEY_ID: ci-v1
      CLAMAV_HOST: localhost
      CLAMAV_PORT: 3310
      RUN_CLAMAV_INTEGRATION: true
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm db:validate
      - run: pnpm db:deploy
      - run: pnpm db:seed
      - run: pnpm test:security:integration
      - run: pnpm test:security:clamav

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
